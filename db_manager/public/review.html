<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review &amp; Approve — Biblical Contradictions</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Review &amp; Approve</h1>
        <p class="subtitle">Approvals are stored separately — the content database is never modified here</p>
    </header>

    <main>
        <section class="toolbar">
            <div class="review-progress">
                <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
                <div class="progress-counts" id="progress-counts">Loading…</div>
            </div>
            <div class="actions">
                <label class="reviewer-label">Reviewer
                    <input type="text" id="reviewer-input" placeholder="your name (optional)">
                </label>
                <a class="btn btn-secondary" href="index.html">← Editor</a>
            </div>
        </section>

        <section class="filter-bar">
            <div class="sort-group">
                <label for="status-filter">Show:</label>
                <select id="status-filter" onchange="handleFilter()">
                    <option value="pending">Pending (undecided)</option>
                    <option value="needs_review">Needs review (auto-flagged)</option>
                    <option value="approved">Approved</option>
                    <option value="needs_changes">Needs changes</option>
                    <option value="rejected">Rejected</option>
                    <option value="stale">Stale (edited since review)</option>
                    <option value="all">All</option>
                </select>
            </div>
            <div class="sort-group">
                <label for="scope-filter">Range:</label>
                <select id="scope-filter" onchange="handleFilter()">
                    <option value="all">All ids</option>
                    <option value="1-200">ids 1–200</option>
                    <option value="201-9999">ids 201+</option>
                </select>
            </div>
            <div class="filter-group">
                <span class="filter-count" id="result-count"></span>
            </div>
        </section>

        <section class="search-section">
            <input type="text" id="search-input" placeholder="Search question / commentary…" oninput="handleFilter()">
        </section>

        <section class="contradictions-list" id="review-list">
            <p class="loading">Loading…</p>
        </section>

        <div class="load-more-wrap" id="load-more-wrap" style="display:none;">
            <button class="btn btn-secondary" onclick="loadMore()" id="load-more-btn">Load more</button>
        </div>
    </main>

    <script src="review.js"></script>
</body>
</html>
